<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07040f" />
    <title>Rainbow Chomp · ideas</title>
    <meta
      name="description"
      content="A Pac-Man mouth that follows your pointer and sprays a rushing rainbow when it moves."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;650&family=Fraunces:opsz,wght@9..144,560&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/idea.css" />
    <style>
      :root {
        --open: 0;
        --chomp-size: 92vmin;
        --ink: #f4f7ff;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        background: radial-gradient(ellipse at center, #1a1030 0%, #07040f 55%, #05030a 100%);
        color: var(--ink);
        font-family: var(--sans);
      }

      .idea-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        color: var(--ink);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
        padding-top: calc(0.85rem + env(safe-area-inset-top, 0px));
        padding-left: calc(1.1rem + env(safe-area-inset-left, 0px));
        padding-right: calc(1.1rem + env(safe-area-inset-right, 0px));
        padding-bottom: 0.85rem;
      }

      .idea-bar a {
        justify-self: start;
      }

      .idea-bar .toy-name {
        justify-self: end;
      }

      .idea-bar .hint {
        justify-self: center;
        margin: 0;
        font-size: 0.78rem;
        font-weight: 550;
        letter-spacing: 0.03em;
        opacity: 0.8;
        pointer-events: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        touch-action: none;
      }

      .chomp {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--chomp-size);
        height: var(--chomp-size);
        pointer-events: none;
        will-change: transform;
        z-index: 1;
      }

      .spray {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 85vmax;
        height: 120%;
        transform-origin: 0 50%;
        z-index: 0;
        pointer-events: none;
        clip-path: polygon(0 50%, 100% 0, 100% 100%);
        will-change: transform, opacity;
      }

      .spray-glow {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(255, 214, 10, 0.45) 12%,
          transparent 55%
        );
        opacity: 0.85;
        mix-blend-mode: screen;
      }

      .stream {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .bands {
        width: 200%;
        height: 100%;
        background-image: repeating-linear-gradient(
          90deg,
          #ff2d55 0 36px,
          #ff7a00 36px 72px,
          #ffd60a 72px 108px,
          #34c759 108px 144px,
          #0a84ff 144px 180px,
          #5e5ce6 180px 216px,
          #bf5af2 216px 252px
        );
        animation: stream 0.48s linear infinite;
        will-change: transform;
      }

      @keyframes stream {
        to {
          transform: translateX(-252px);
        }
      }

      .face {
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      .head {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #ffe97a 0 18%, #ffd000 48%, #f0b400 100%);
        --wedge: calc(var(--open) * 96deg);
        --from: calc(90deg - var(--open) * 48deg);
        -webkit-mask-image: conic-gradient(
          from var(--from),
          transparent 0,
          transparent var(--wedge),
          #000 var(--wedge),
          #000 360deg
        );
        mask-image: conic-gradient(
          from var(--from),
          transparent 0,
          transparent var(--wedge),
          #000 var(--wedge),
          #000 360deg
        );
      }

      .eye {
        position: absolute;
        z-index: 3;
        width: 9.5%;
        height: 9.5%;
        left: 38%;
        top: 18%;
        border-radius: 50%;
        background: #1a1020;
        box-shadow: 1px 2px 0 rgba(255, 255, 255, 0.18);
      }

      @media (prefers-reduced-motion: reduce) {
        .bands {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <nav class="idea-bar">
      <a href="../../">← ideas</a>
      <p class="hint">Move to chomp</p>
      <span class="toy-name">Rainbow Chomp</span>
    </nav>

    <div class="stage" id="stage" aria-label="Rainbow Chomp">
      <div class="chomp" id="chomp">
        <div class="spray" id="spray" aria-hidden="true">
          <div class="spray-glow"></div>
          <div class="stream">
            <div class="bands"></div>
          </div>
        </div>
        <div class="face">
          <div class="head" id="head"></div>
          <div class="eye"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.documentElement;
        const chomp = document.getElementById("chomp");
        const spray = document.getElementById("spray");
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const followDur = reduce ? 0.05 : 0.28;
        const openDur = reduce ? 0.05 : 0.16;
        const rotDur = reduce ? 0.05 : 0.32;
        const IDLE = 180;
        const midX = window.innerWidth / 2;
        const midY = window.innerHeight / 2;

        gsap.set(chomp, {
          xPercent: -50,
          yPercent: -50,
          x: midX,
          y: midY,
          rotation: 0,
        });
        gsap.set(spray, {
          opacity: 0,
          scaleX: 0.15,
          scaleY: 0,
          yPercent: -50,
          transformOrigin: "0% 50%",
        });
        root.style.setProperty("--open", "0");

        const xTo = gsap.quickTo(chomp, "x", { duration: followDur, ease: "power3.out" });
        const yTo = gsap.quickTo(chomp, "y", { duration: followDur, ease: "power3.out" });
        const rotTo = gsap.quickTo(chomp, "rotation", { duration: rotDur, ease: "power2.out" });
        const sprayOp = gsap.quickTo(spray, "opacity", { duration: openDur, ease: "power2.out" });
        const sprayX = gsap.quickTo(spray, "scaleX", { duration: openDur, ease: "power2.out" });
        const sprayY = gsap.quickTo(spray, "scaleY", { duration: openDur, ease: "power2.out" });
        const openTo = gsap.quickTo(root, "--open", { duration: openDur, ease: "power2.out" });

        let lastX = midX;
        let lastY = midY;
        let rot = 0;
        let idle = 0;
        let opened = false;

        function setOpen(open) {
          if (open === opened) {
            if (open) {
              sprayOp(1);
              sprayX(1);
              sprayY(1);
              openTo(1);
            }
            return;
          }
          opened = open;
          const t = open ? 1 : 0;
          sprayOp(t);
          sprayX(open ? 1 : 0.15);
          sprayY(t);
          openTo(t);
        }

        function shortest(current, target) {
          const diff = ((((target - current) % 360) + 540) % 360) - 180;
          return current + diff;
        }

        function move(event) {
          const x = event.clientX;
          const y = event.clientY;
          const dx = x - lastX;
          const dy = y - lastY;
          xTo(x);
          yTo(y);
          if (dx * dx + dy * dy > 16) {
            rot = shortest(rot, (Math.atan2(dy, dx) * 180) / Math.PI);
            rotTo(rot);
          }
          lastX = x;
          lastY = y;
          setOpen(true);
          window.clearTimeout(idle);
          idle = window.setTimeout(function () {
            setOpen(false);
          }, IDLE);
        }

        document.addEventListener("pointerdown", move);
        document.addEventListener("pointermove", move);
      })();
    </script>
  </body>
</html>
