<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081028" />
    <title>Tiny Planet · ideas</title>
    <meta
      name="description"
      content="A little Earth at the bottom of the sky, turning from day to night. Drag to throw it; the eyes follow you."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;650&family=Fraunces:opsz,wght@9..144,560&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/idea.css" />
    <style>
      :root {
        --day: 1;
        --planet-size: min(42vh, 70vw);
        --orbit-r: calc(var(--planet-size) * 1.12 + 16vh);
        --ink: #f4f7ff;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        background: #07051a;
        color: var(--ink);
        font-family: var(--sans);
      }

      .idea-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        color: var(--ink);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
        padding-top: calc(0.85rem + env(safe-area-inset-top, 0px));
        padding-left: calc(1.1rem + env(safe-area-inset-left, 0px));
        padding-right: calc(1.1rem + env(safe-area-inset-right, 0px));
        padding-bottom: 0.85rem;
        z-index: 8;
      }

      .idea-bar a {
        justify-self: start;
      }

      .idea-bar .toy-name {
        justify-self: end;
      }

      .idea-bar .hint {
        justify-self: center;
        margin: 0;
        font-size: 0.78rem;
        font-weight: 550;
        letter-spacing: 0.03em;
        opacity: 0.82;
        pointer-events: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        touch-action: none;
        cursor: grab;
        overflow: hidden;
      }

      .stage.is-dragging {
        cursor: grabbing;
      }

      .sky,
      .sky-day,
      .sky-night {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .sky-night {
        background: radial-gradient(ellipse at 50% 100%, #3a1c4a 0%, #1a1640 38%, #07051a 78%);
        z-index: 0;
      }

      .sky-day {
        background: radial-gradient(ellipse at 50% 100%, #ffe7c2 0%, #7ec8e8 42%, #4ea4d9 78%);
        opacity: var(--day);
        z-index: 1;
      }

      #starfield {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        opacity: calc(0.12 + (1 - var(--day)) * 0.88);
      }

      .giant-star {
        position: absolute;
        top: calc(10% + env(safe-area-inset-top, 0px));
        left: 7%;
        width: min(22vmin, 160px);
        height: min(22vmin, 160px);
        z-index: 3;
        pointer-events: none;
        opacity: calc(0.22 + (1 - var(--day)) * 0.78);
        will-change: transform, opacity;
        animation: twinkle 3.6s ease-in-out infinite;
        filter: none;
      }

      .giant-star svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }

      @keyframes twinkle {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
        }
        50% {
          transform: scale(1.07) rotate(6deg);
        }
      }


      .planet-anchor {
        position: absolute;
        left: 50%;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        width: var(--planet-size);
        height: var(--planet-size);
        transform: translateX(-50%);
        z-index: 4;
        pointer-events: none;
      }

      .orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        z-index: 2;
        will-change: transform;
      }

      .sun-pos,
      .moon-pos {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }

      .sun-pos {
        transform: translateY(calc(-1 * var(--orbit-r)));
      }

      .moon-pos {
        transform: translateY(var(--orbit-r));
      }

      .celestial {
        position: absolute;
        left: 0;
        top: 0;
        width: 86px;
        height: 86px;
        margin: -43px 0 0 -43px;
        will-change: transform;
      }

      .sun .rays {
        position: absolute;
        inset: -28px;
        animation: ray-spin 28s linear infinite;
        will-change: transform;
      }

      .sun .ray {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 20px;
        margin: 0 0 0 -2.5px;
        border-radius: 3px;
        background: #ffd056;
        transform-origin: 50% 0;
      }

      @keyframes ray-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .sun .disc {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 32%, #fff4c2, #ffd056 42%, #f0a020 100%);
        box-shadow: 0 0 28px rgba(255, 200, 80, 0.55);
      }

      .moon .disc {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 32%, #fff, #e8e4d8 48%, #c9c3b2 100%);
        box-shadow: 0 0 18px rgba(200, 210, 255, 0.28);
      }

      .crater {
        position: absolute;
        border-radius: 50%;
        background: rgba(160, 154, 138, 0.45);
      }

      .crater.a {
        width: 16px;
        height: 14px;
        left: 16px;
        top: 22px;
      }

      .crater.b {
        width: 9px;
        height: 9px;
        right: 18px;
        top: 16px;
      }

      .crater.c {
        width: 11px;
        height: 10px;
        right: 20px;
        bottom: 18px;
      }

      .atmosphere {
        position: absolute;
        inset: -7%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          transparent 62%,
          color-mix(in srgb, #b9e7ff 70%, #3a5a9a) 78%,
          transparent 86%
        );
        opacity: calc(0.45 + var(--day) * 0.55);
        z-index: 1;
        pointer-events: none;
      }

      .world {
        position: absolute;
        inset: 0;
        z-index: 3;
        will-change: transform;
      }

      .globe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        border-radius: 50%;
      }

      .shade {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(
          180deg,
          transparent 28%,
          rgba(8, 10, 40, 0.18) 58%,
          rgba(6, 8, 28, 0.62) 100%
        );
        opacity: calc(0.35 + (1 - var(--day)) * 0.65);
        pointer-events: none;
        will-change: transform;
        z-index: 4;
      }

      .night-veil {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(16, 24, 72, 0.42);
        opacity: calc((1 - var(--day)) * 0.7);
        pointer-events: none;
        z-index: 5;
      }

      .seat {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
      }

      .art {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, calc(-0.5 * var(--planet-size) - 2px));
        transform-origin: 50% 100%;
      }

      .pond .art {
        width: 24%;
        height: 10%;
        transform: translate(-50%, calc(-0.5 * var(--planet-size) + 14%));
      }

      .pond-water {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at 40% 35%,
          color-mix(in srgb, #d9f6ff calc(var(--day) * 100%), #9bb8d4) 0%,
          color-mix(in srgb, #3da0c8 calc(var(--day) * 100%), #1e3a66) 70%
        );
        box-shadow: inset 0 -2px 4px rgba(0, 30, 60, 0.25);
      }

      .pond-shine {
        position: absolute;
        left: 18%;
        top: 22%;
        width: 42%;
        height: 28%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        opacity: calc(0.25 + var(--day) * 0.55);
      }

      .tree .art {
        width: 22%;
        height: 32%;
      }

      .tree-svg,
      .duck-svg,
      .face-svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }

      .duck .art {
        width: 16%;
        height: 16%;
        transform: translate(-50%, calc(-0.5 * var(--planet-size) - 1%));
      }

      .eyes {
        position: absolute;
        display: flex;
        gap: 6px;
        z-index: 3;
      }

      .sun .eyes {
        left: 50%;
        top: 36%;
        transform: translate(-50%, 0);
      }

      .moon .eyes {
        left: 50%;
        top: 34%;
        transform: translate(-50%, 0);
      }

      .eye {
        position: relative;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(20, 16, 30, 0.12);
      }

      .sun .eye,
      .moon .eye {
        width: 15px;
        height: 15px;
      }

      .tree-eyes {
        position: absolute;
        left: 50%;
        top: 60%;
        transform: translate(-50%, 0);
        gap: 5px;
      }

      .tree-eyes .eye {
        width: 9px;
        height: 9px;
      }

      .duck-eyes {
        position: absolute;
        left: 54%;
        top: 18%;
        transform: translate(-50%, 0);
        gap: 3px;
      }

      .duck-eyes .eye {
        width: 8px;
        height: 8px;
      }

      .pupil {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46%;
        height: 46%;
        margin: -23% 0 0 -23%;
        border-radius: 50%;
        background: #1a1220;
        will-change: transform;
      }

      .lid {
        position: absolute;
        inset: -1px;
        background: #f0d056;
        transform: scaleY(0);
        transform-origin: 50% 0%;
        border-radius: 50%;
        will-change: transform;
        pointer-events: none;
        z-index: 5;
      }

      .lid::after {
        content: "";
        position: absolute;
        left: 18%;
        right: 18%;
        top: 46%;
        height: 2px;
        border-radius: 2px;
        background: rgba(26, 18, 32, 0.55);
      }

      .moon .lid {
        background: #e8e4d8;
      }

      .sun .lid {
        background: #ffd056;
      }

      .tree-eyes .lid {
        background: #7a4e2d;
      }

      .tree-eyes .lid::after,
      .duck-eyes .lid::after {
        height: 1px;
      }

      .duck-eyes .lid {
        background: #f4d35e;
      }

      @media (prefers-reduced-motion: reduce) {
        .giant-star,
        .sun .rays {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <nav class="idea-bar">
      <a href="../../">← ideas</a>
      <p class="hint">Drag to throw</p>
      <span class="toy-name">Tiny Planet</span>
    </nav>

    <div class="stage" id="stage" aria-label="Tiny Planet">
      <div class="sky-night"></div>
      <div class="sky-day"></div>
      <canvas id="starfield" aria-hidden="true"></canvas>

      <div class="giant-star" id="giant-star" aria-hidden="true">
        <svg viewBox="-10 -10 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="giantGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffce8" />
              <stop offset="45%" stop-color="#ffe56a" />
              <stop offset="100%" stop-color="#ffbf3a" />
            </radialGradient>
          </defs>
          <path
            fill="url(#giantGlow)"
            d="M50 0 L61 31 L96 31 L68 52 L78 85 L50 65 L22 85 L32 52 L4 31 L39 31 Z"
          />
          <path
            fill="#fff6b0"
            opacity="0.85"
            transform="rotate(36 50 50)"
            d="M50 18 L56 38 L76 38 L60 50 L66 70 L50 58 L34 70 L40 50 L24 38 L44 38 Z"
          />
        </svg>
      </div>

      <div class="planet-anchor" id="anchor">
        <div class="orbit" id="orbit">
          <div class="sun-pos">
            <div class="celestial sun" id="sun">
              <div class="rays" aria-hidden="true">
                <span class="ray" style="transform: rotate(0deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(30deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(60deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(90deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(120deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(150deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(180deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(210deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(240deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(270deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(300deg) translateY(-42px)"></span>
                <span class="ray" style="transform: rotate(330deg) translateY(-42px)"></span>
              </div>
              <div class="disc"></div>
              <div class="eyes">
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
              </div>
            </div>
          </div>
          <div class="moon-pos">
            <div class="celestial moon" id="moon">
              <div class="disc">
                <span class="crater a"></span>
                <span class="crater b"></span>
                <span class="crater c"></span>
              </div>
              <div class="eyes">
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="atmosphere" aria-hidden="true"></div>

        <div class="world" id="world">
          <svg class="globe" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <clipPath id="disk">
                <circle cx="100" cy="100" r="100" />
              </clipPath>
              <radialGradient id="ocean" cx="38%" cy="32%" r="80%">
                <stop offset="0%" stop-color="#5eb3d6" />
                <stop offset="55%" stop-color="#2f7daf" />
                <stop offset="100%" stop-color="#1d5e88" />
              </radialGradient>
            </defs>
            <g clip-path="url(#disk)">
              <circle cx="100" cy="100" r="100" fill="url(#ocean)" />
              <ellipse cx="58" cy="78" rx="38" ry="26" fill="#5faf6b" transform="rotate(-18 58 78)" />
              <ellipse cx="70" cy="86" rx="18" ry="14" fill="#74c07a" transform="rotate(16 70 86)" />
              <ellipse cx="80" cy="36" rx="28" ry="18" fill="#5faf6b" transform="rotate(-8 80 36)" />
              <ellipse cx="148" cy="70" rx="30" ry="22" fill="#6bb56f" transform="rotate(20 148 70)" />
              <ellipse cx="130" cy="128" rx="36" ry="20" fill="#4e9a5c" transform="rotate(-30 130 128)" />
              <ellipse cx="46" cy="140" rx="24" ry="16" fill="#68b56c" />
              <ellipse cx="150" cy="48" rx="14" ry="9" fill="#d9a85c" />
              <circle cx="128" cy="16" r="16" fill="#eef6ff" />
              <circle cx="86" cy="190" r="16" fill="#e8f2ff" opacity="0.9" />
            </g>
            <circle cx="100" cy="100" r="99" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
          </svg>
          <div class="shade" id="shade"></div>
          <div class="night-veil"></div>

          <div class="seat pond" style="transform: rotate(48deg)">
            <div class="art">
              <div class="pond-water"></div>
              <div class="pond-shine"></div>
            </div>
          </div>

          <div class="seat tree" style="transform: rotate(-22deg)">
            <div class="art">
              <svg class="tree-svg" viewBox="0 0 80 110" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="48" rx="30" ry="28" fill="#2f8a4a" />
                <ellipse cx="24" cy="42" rx="16" ry="16" fill="#3f9a5f" />
                <ellipse cx="56" cy="40" rx="15" ry="15" fill="#3a9658" />
                <ellipse cx="40" cy="28" rx="14" ry="13" fill="#4caf69" />
                <rect x="33" y="68" width="14" height="36" rx="5" fill="#7a4e2d" />
                <rect x="28" y="86" width="8" height="4" rx="2" fill="#6a4024" transform="rotate(-28 32 88)" />
              </svg>
              <div class="eyes tree-eyes">
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
              </div>
            </div>
          </div>

          <div class="seat duck" id="duck-seat">
            <div class="art">
              <svg class="duck-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="58" rx="22" ry="14" fill="#f4d35e" />
                <circle cx="50" cy="40" r="13" fill="#f7dc76" />
                <path d="M60 40 L76 37 L60 48 Z" fill="#e07a3d" />
                <ellipse cx="30" cy="58" rx="8" ry="6" fill="#e8c44c" />
                <ellipse cx="32" cy="72" rx="5" ry="3" fill="#e07a3d" />
                <ellipse cx="46" cy="72" rx="5" ry="3" fill="#e07a3d" />
              </svg>
              <div class="eyes duck-eyes">
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
                <span class="eye"><span class="pupil"></span><span class="lid"></span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.documentElement;
        const stage = document.getElementById("stage");
        const world = document.getElementById("world");
        const orbit = document.getElementById("orbit");
        const shade = document.getElementById("shade");
        const sun = document.getElementById("sun");
        const moon = document.getElementById("moon");
        const duckSeat = document.getElementById("duck-seat");
        const canvas = document.getElementById("starfield");
        const ctx = canvas.getContext("2d", { alpha: true });
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const lids = Array.prototype.slice.call(document.querySelectorAll(".lid"));
        const pupils = Array.prototype.slice.call(document.querySelectorAll(".pupil"));
        const eyes = Array.prototype.slice.call(document.querySelectorAll(".eye"));

        const AUTO_VEL = (Math.PI * 2) / 26;
        const TIME_SPEED = reduce ? 1 / 40 : 1 / 14;
        const DUCK_SPEED = 360 / 11;
        const FRICTION = 0.985;
        const IDLE_MS = 2000;
        const MAX_VEL = 22;

        let time = 0.42;
        let angle = 0;
        let vel = AUTO_VEL;
        let duckAng = -58;
        let autoplay = true;
        let bracing = false;
        let pointerX = window.innerWidth * 0.5;
        let pointerY = window.innerHeight * 0.28;
        let dragging = false;
        let lastPointerAngle = 0;
        let lastMoveT = 0;
        let velSamples = [];
        let idleTimer = 0;
        let stars = [];
        let showers = [];
        let w = 0;
        let h = 0;
        let dpr = 1;

        function dayValue(t) {
          return 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
        }

        function wrapDelta(d) {
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          return d;
        }

        function planetCenter() {
          const r = world.getBoundingClientRect();
          return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function angleAt(x, y) {
          const c = planetCenter();
          return Math.atan2(y - c.y, x - c.x);
        }

        function resize() {
          dpr = Math.min(2, window.devicePixelRatio || 1);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.max(1, Math.round(w * dpr));
          canvas.height = Math.max(1, Math.round(h * dpr));
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          seedStars();
        }

        function seedStars() {
          const count = Math.round(Math.min(140, 70 + (w * h) / 14000));
          stars = [];
          for (let i = 0; i < count; i++) {
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: 0.4 + Math.random() * 1.4,
              p: Math.random() * Math.PI * 2,
              s: 0.6 + Math.random() * 1.8,
            });
          }
          showers = [];
          for (let i = 0; i < 5; i++) spawnShower(true);
        }

        function spawnShower(anywhere) {
          showers.push({
            x: anywhere ? Math.random() * w : Math.random() * w * 0.9,
            y: anywhere ? Math.random() * h * 0.5 : -12,
            vx: 80 + Math.random() * 140,
            vy: 140 + Math.random() * 220,
            len: 18 + Math.random() * 36,
            life: anywhere ? Math.random() : 0,
          });
        }

        function drawStars(dt) {
          ctx.clearRect(0, 0, w, h);
          const night = 1 - dayValue(time);
          if (night < 0.04 && !reduce) return;
          ctx.fillStyle = "#fff8dc";
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.y += (8 + s.s * 10) * dt * (0.35 + night);
            if (s.y > h + 4) {
              s.y = -4;
              s.x = Math.random() * w;
            }
            const tw = 0.45 + 0.55 * Math.abs(Math.sin(s.p + performance.now() * 0.001 * s.s));
            ctx.globalAlpha = tw * (0.2 + night * 0.8);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (reduce) return;
          if (showers.length < 8 && Math.random() < dt * (0.4 + night * 1.6)) spawnShower(false);
          for (let i = showers.length - 1; i >= 0; i--) {
            const m = showers[i];
            m.x += m.vx * dt;
            m.y += m.vy * dt;
            m.life += dt;
            const fade = m.y > h || m.x > w + 40 ? 0 : 1;
            ctx.strokeStyle = "rgba(255, 244, 210, " + (0.25 + night * 0.7) + ")";
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(m.x - (m.vx / m.vy) * m.len, m.y - m.len);
            ctx.stroke();
            if (fade === 0 || m.life > 3.2) showers.splice(i, 1);
          }
        }

        function applyCycle() {
          const day = dayValue(time);
          root.style.setProperty("--day", day.toFixed(4));
          const rot = (time - 0.5) * 360;
          orbit.style.transform = "rotate(" + rot + "deg)";
          sun.style.transform = "rotate(" + -rot + "deg)";
          moon.style.transform = "rotate(" + -rot + "deg)";
          shade.style.transform = "rotate(" + rot + "deg)";
        }

        function applySpin() {
          world.style.transform = "rotate(" + angle + "rad)";
          duckSeat.style.transform = "rotate(" + duckAng + "deg)";
        }

        function look() {
          if (bracing) return;
          for (let i = 0; i < eyes.length; i++) {
            const eye = eyes[i];
            const pupil = pupils[i];
            const r = eye.getBoundingClientRect();
            if (!r.width) continue;
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            const dx = pointerX - cx;
            const dy = pointerY - cy;
            const max = r.width * 0.22;
            const d = Math.hypot(dx, dy) || 1;
            const k = Math.min(max, d) / d;
            pupil.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
          }
        }

        function setBracing(on) {
          if (on === bracing) return;
          bracing = on;
          gsap.to(lids, {
            scaleY: on ? 1 : 0,
            duration: reduce ? 0.05 : 0.14,
            ease: "power2.out",
            overwrite: true,
          });
          if (!on) look();
        }

        function bumpInteract() {
          autoplay = false;
          setBracing(true);
          window.clearTimeout(idleTimer);
          idleTimer = window.setTimeout(resumeAutoplay, IDLE_MS);
        }

        function resumeAutoplay() {
          autoplay = true;
          setBracing(false);
        }

        function onPointerDown(event) {
          if (event.target.closest && event.target.closest("a")) return;
          if (event.pointerType === "mouse" && event.button !== 0) return;
          dragging = true;
          stage.classList.add("is-dragging");
          pointerX = event.clientX;
          pointerY = event.clientY;
          lastPointerAngle = angleAt(event.clientX, event.clientY);
          lastMoveT = event.timeStamp || performance.now();
          velSamples = [];
          bumpInteract();
          if (stage.setPointerCapture) {
            try {
              stage.setPointerCapture(event.pointerId);
            } catch (err) {}
          }
        }

        function onPointerMove(event) {
          pointerX = event.clientX;
          pointerY = event.clientY;
          if (!dragging) {
            look();
            return;
          }
          const now = event.timeStamp || performance.now();
          const a = angleAt(event.clientX, event.clientY);
          const da = wrapDelta(a - lastPointerAngle);
          const dt = Math.max(0.001, (now - lastMoveT) / 1000);
          angle += da;
          vel = da / dt;
          velSamples.push(vel);
          if (velSamples.length > 6) velSamples.shift();
          lastPointerAngle = a;
          lastMoveT = now;
          bumpInteract();
          applySpin();
        }

        function onPointerUp(event) {
          if (!dragging) return;
          dragging = false;
          stage.classList.remove("is-dragging");
          if (velSamples.length) {
            let sum = 0;
            for (let i = 0; i < velSamples.length; i++) sum += velSamples[i];
            vel = sum / velSamples.length;
          }
          vel = Math.max(-MAX_VEL, Math.min(MAX_VEL, vel));
          bumpInteract();
        }

        function onWheel(event) {
          event.preventDefault();
          const delta = event.deltaY + event.deltaX;
          const impulse = delta * 0.012;
          vel = Math.max(-MAX_VEL, Math.min(MAX_VEL, vel + impulse));
          angle += impulse * 0.08;
          bumpInteract();
          applySpin();
        }

        function tick(gsapTime, deltaMS) {
          const dt = Math.min(0.05, (deltaMS || 16.67) / 1000);
          time += TIME_SPEED * dt;
          if (time >= 1) time -= 1;
          if (autoplay) {
            vel += (AUTO_VEL - vel) * Math.min(1, 2.4 * dt);
          } else if (!dragging) {
            vel *= Math.pow(FRICTION, dt * 60);
          }
          if (!dragging) angle += vel * dt;
          duckAng += DUCK_SPEED * dt;
          if (duckAng > 360) duckAng -= 360;
          applyCycle();
          applySpin();
          look();
          drawStars(dt);
        }

        window.addEventListener("resize", resize);
        stage.addEventListener("pointerdown", onPointerDown);
        stage.addEventListener("pointermove", onPointerMove);
        stage.addEventListener("pointerup", onPointerUp);
        stage.addEventListener("pointercancel", onPointerUp);
        stage.addEventListener("lostpointercapture", onPointerUp);
        document.addEventListener("pointermove", function (event) {
          if (dragging) return;
          pointerX = event.clientX;
          pointerY = event.clientY;
          look();
        });
        stage.addEventListener("wheel", onWheel, { passive: false });

        resize();
        gsap.set(lids, { scaleY: 0, transformOrigin: "50% 0%" });
        applyCycle();
        applySpin();
        gsap.ticker.add(tick);

        window.__tinyPlanet = {
          setTime: function (t) {
            time = ((t % 1) + 1) % 1;
            applyCycle();
          },
          getTime: function () {
            return time;
          },
          getDay: function () {
            return dayValue(time);
          },
          getAngle: function () {
            return angle;
          },
          getVel: function () {
            return vel;
          },
          isBracing: function () {
            return bracing;
          },
          isAutoplay: function () {
            return autoplay;
          },
          isDragging: function () {
            return dragging;
          },
        };
      })();
    </script>
  </body>
</html>
